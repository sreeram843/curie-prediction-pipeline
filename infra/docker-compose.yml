services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: curie-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: curie-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        for topic in observations conditions medications alerts rules dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOT \
            --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
        echo "Topics ready."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOT --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: curie-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: curie
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  jobmanager:
    image: flink:1.20-java17
    container_name: curie-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        taskmanager.numberOfTaskSlots: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  taskmanager:
    image: flink:1.20-java17
    container_name: curie-flink-taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  # --- profile: full (API + rules seed + package/submit Flink jobs) ---

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: curie-api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CURIE_KAFKA_ALERTS_CONSUMER: "true"
      CURIE_CLEAR_DEMO_ON_LIVE: "true"
      CURIE_KAFKA_ALERTS_GROUP: curie-api-alerts-v1
    depends_on:
      kafka:
        condition: service_healthy

  rules-publish:
    profiles: ["full"]
    image: apache/kafka:3.8.1
    container_name: curie-rules-publish
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - ../streaming/rule-registry/bundles:/bundles:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        for f in sepsis-sofa.v0.3.0.json aki-kdigo.v0.3.0.json; do
          echo "Publishing $$f → rules"
          tr -d '\n' < "/bundles/$$f" | /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server $$BOOT --topic rules
        done
        echo "Rules published."

  flink-package:
    profiles: ["full"]
    image: maven:3.9.9-eclipse-temurin-17
    container_name: curie-flink-package
    working_dir: /w
    volumes:
      - ../streaming/flink-jobs:/w
      - flink-jars:/jars
      - maven-cache:/root/.m2
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        mvn -B -pl sofa -am package -DskipTests
        cp -f sofa/target/curie-sofa-*.jar /jars/curie-sofa.jar
        ls -la /jars/curie-sofa.jar

  flink-submit:
    profiles: ["full"]
    image: flink:1.20-java17
    container_name: curie-flink-submit
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      flink-package:
        condition: service_completed_successfully
      rules-publish:
        condition: service_completed_successfully
    restart: "no"
    environment:
      FLINK_JOBMANAGER: jobmanager:8081
      JAR_PATH: /jars/curie-sofa.jar
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - flink-jars:/jars:ro
      - ../scripts/flink_submit_compose.sh:/submit.sh:ro
    entrypoint: ["/bin/bash", "/submit.sh"]

volumes:
  flink-jars:
  maven-cache:
