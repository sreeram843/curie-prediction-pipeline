name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Parity gate (Python)
        run: python -m eval.parity.gate

  flink-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile Flink modules + parity fixtures
        working-directory: streaming/flink-jobs
        run: mvn -B -q test

  parity:
    name: Cross-runtime parity (CURIE-007)
    needs: [python, flink-compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Report fixture counts and zero mismatches
        run: |
          python -m eval.parity.gate | tee parity-report.txt
          grep -q 'PARITY_OK=true' parity-report.txt
          grep -E 'fixtures=[1-9]' parity-report.txt
      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.txt
