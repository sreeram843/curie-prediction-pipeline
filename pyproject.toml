[project]
name = "curie-prediction-pipeline"
version = "0.1.0"
description = "Streaming FHIR clinical deterioration platform (prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
kafka = [
  "confluent-kafka>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["eval", "ingestion", "action"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "eval*", "action*"]
